name: Build Windows VST3

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "build\IridescentFlower_artefacts\Release\VST3\Iridescent Flower.vst3" "artifact\" -Recurse
          Copy-Item "build\Release\IridescentBbdCustom.dll" "artifact\" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: Iridescent-Flower-Windows
          path: artifact
          if-no-files-found: error
